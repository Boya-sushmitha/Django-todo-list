<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white text-center">
            <h2>📝 To-Do List Project</h2>
        </div>

        <div class="card-body">

            <form method="POST" class="d-flex mb-4">
                {% csrf_token %}

                <input type="text"
                       name="title"
                       class="form-control me-2"
                       placeholder="Enter Task"
                       required>

                <button class="btn btn-success">
                    Add
                </button>

            </form>

            <table class="table table-bordered table-hover text-center">

                <thead class="table-dark">

                    <tr>
                        <th>Task</th>
                        <th>Status</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>

                </thead>

                <tbody>

                {% for task in tasks %}

                    <tr>

                        <td>

                            {% if task.completed %}
                                <del>{{ task.title }}</del>
                            {% else %}
                                {{ task.title }}
                            {% endif %}

                        </td>

                        <td>

                            {% if task.completed %}

                                <a href="{% url 'complete' task.id %}" class="btn btn-success btn-sm">
                                    Completed
                                </a>

                            {% else %}

                                <a href="{% url 'complete' task.id %}" class="btn btn-warning btn-sm">
                                    Pending
                                </a>

                            {% endif %}

                        </td>

                        <td>

                            <a href="{% url 'update' task.id %}" class="btn btn-info btn-sm">
                                Edit
                            </a>

                        </td>

                        <td>

                            <a href="{% url 'delete' task.id %}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure?')">

                                Delete

                            </a>

                        </td>

                    </tr>

                {% empty %}

                    <tr>
                        <td colspan="4">
                            No Tasks Found
                        </td>
                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
